<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#1e1e1e"/>
  <!-- Simple flow diagram: two boxes connected by an arrow -->
  <rect x="3" y="5" width="10" height="7" rx="2" fill="none" stroke="#569cd6" stroke-width="1.5"/>
  <rect x="19" y="5" width="10" height="7" rx="2" fill="none" stroke="#569cd6" stroke-width="1.5"/>
  <line x1="13" y1="8.5" x2="19" y2="8.5" stroke="#569cd6" stroke-width="1.5"/>
  <polygon points="18,7 21,8.5 18,10" fill="#569cd6"/>
  <!-- Diamond decision node -->
  <polygon points="16,16 22,21 16,26 10,21" fill="none" stroke="#4ec9b0" stroke-width="1.5"/>
</svg>
